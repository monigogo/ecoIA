[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarlife-backend"
version = "0.1.0"
description = "SolarLife AI backend — conversational solar planning agent (ODS 7)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SolarLife" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "deepagents>=0.0.5",
    "langchain>=0.3",
    "langchain-nvidia-ai-endpoints>=1.2.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.1",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pvlib>=0.11",
    "rdtools>=2.1",
    "geopy>=2.4",
    "diskcache>=5.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "smoke: tests that require real external LLM/API credentials",
    "slow: long-running end-to-end or smoke validations",
]
